name: Release

on:
  schedule:
    # 06:00 UTC daily — quiet hours for most timezones, avoids GitHub-wide cron stampedes on the hour mark.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore TriggerHelper.csproj

      - name: Publish
        run: dotnet publish TriggerHelper.csproj -c Release --no-restore -o ./publish

      - name: Stage release tree
        run: |
          mkdir -p stage/modules/TriggerHelper
          mkdir -p stage/configs/TriggerHelper
          cp publish/TriggerHelper.dll               stage/modules/TriggerHelper/
          cp publish/TriggerHelper.deps.json         stage/modules/TriggerHelper/
          cp publish/TriggerHelper.runtimeconfig.json stage/modules/TriggerHelper/
          cp -r configs/. stage/configs/TriggerHelper/

      - name: Compute version
        id: version
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=TriggerHelper-${tag}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Pack archive
        run: |
          cd stage
          tar -czf "../${{ steps.version.outputs.archive }}" modules configs

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TriggerHelper ${{ steps.version.outputs.tag }}
          files: ${{ steps.version.outputs.archive }}
          generate_release_notes: true
          # Daily reruns on the same calendar day reuse the same tag; allow updating instead of failing.
          make_latest: "true"
